<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidmoly Embed Test Panel</title>
  <style>
    body {
      font-family: sans-serif;
      background: #141414;
      color: #fff;
      padding: 20px;
    }
    .test-box {
      margin-bottom: 30px;
      background: #222;
      padding: 15px;
      border-radius: 8px;
    }
    iframe {
      width: 100%;
      height: 450px;
      border: 0;
      background: #000;
    }
  </style>
</head>
<body>

  <h2>Vidmoly Test (Problemli ID: mif0pfxi0ztc)</h2>

  <!-- TEST 1: Təmiz Iframe (ReferrerPolicy və Sandbox YOXDUR) -->
  <div class="test-box">
    <h3>1. Sınaq: Clean Iframe (No Sandbox, No referrerpolicy)</h3>
    <iframe 
      src="https://vidmoly.net/embed-mif0pfxi0ztc.html" 
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true">
    </iframe>
  </div>

  <!-- TEST 2: Dinamik JS Injection -->
  <div class="test-box">
    <h3>2. Sınaq: JS Injection (Kinoflix tərzində atributsuz dinamik yükleme)</h3>
    <div id="player-container"></div>
  </div>

  <script>
    const container = document.getElementById('player-container');
    const ifr = document.createElement('iframe');
    ifr.src = 'https://vidmoly.net/embed-mif0pfxi0ztc.html';
    ifr.allowFullscreen = true;
    ifr.style.width = '100%';
    ifr.style.height = '450px';
    ifr.style.border = '0';
    container.appendChild(ifr);
  </script>

</body>
</html>
