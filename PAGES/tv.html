<script>
  // M3U Mənbəyi
  const m3uUrl = 'https://kinoflix.github.io/iptv.m3u';
  let allChannels = [];

  // DOM Elementləri
  const grid = document.getElementById('grid');
  const loader = document.getElementById('loader');
  const allLoaded = document.getElementById('allLoaded');
  const searchInput = document.getElementById('searchInput');
  const searchBtn = document.getElementById('searchBtn');
  const genreFilter = document.getElementById('genreFilter');
  const modal = document.getElementById('modal');
  const closeModal = document.getElementById('closeModal');
  const playerTitle = document.getElementById('playerTitle');
  const playerSub = document.getElementById('playerSub');
  const themeToggle = document.getElementById('themeToggle');

  // Video.js Oynadıcısının Yaradılması
  const player = videojs('my-video', {
    fluid: true,
    liveui: true
  });

  // 1. M3U Faylını oxuyan və analiz edən funksiya (Parser)
  async function loadM3U() {
    try {
      const response = await fetch(m3uUrl);
      if (!response.ok) throw new Error('M3U faylı yüklənə bilmədi.');
      const data = await response.text();
      
      const lines = data.split('\n');
      let currentChannel = null;
      const categories = new Set();

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();

        if (line.startsWith('#EXTINF:')) {
          currentChannel = {};
          
          // Kanal adını tapmaq (Sonuncu vergüldən sonrakı mətn)
          const commaIndex = line.lastIndexOf(',');
          currentChannel.name = commaIndex !== -1 ? line.substring(commaIndex + 1).trim() : 'Naməlum Kanal';

          // tvg-logo və ya logo tənzimləməsini tutmaq
          const logoMatch = line.match(/tvg-logo="([^"]+)"/i) || line.match(/logo="([^"]+)"/i);
          currentChannel.logo = logoMatch ? logoMatch[1] : 'FILES/IMG/logos/placeholder.png'; // tapılmasa standart loqo

          // group-title (Kateqoriya) tapmaq
          const groupMatch = line.match(/group-title="([^"]+)"/i);
          currentChannel.category = groupMatch ? groupMatch[1].trim() : 'Digər';
          
          categories.add(currentChannel.category);
        } else if (line && !line.startsWith('#') && currentChannel) {
          // Əgər sətir boş deyilsə və şərh sətri deyilsə, bu yayım linkidir (m3u8 və ya digər)
          currentChannel.url = line;
          allChannels.push(currentChannel);
          currentChannel = null;
        }
      }

      // Filtr dropdown-u doldurmaq
      categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        genreFilter.appendChild(option);
      });

      renderChannels(allChannels);

    } catch (error) {
      console.error(error);
      loader.innerHTML = `<div style="color:red;">Xəta baş verdi: Kanalları yükləmək mümkün olmadı.</div>`;
    }
  }

  // 2. Kanalları DOM-da göstərən funksiya
  function renderChannels(channels) {
    grid.innerHTML = '';
    loader.style.display = 'none';

    if (channels.length === 0) {
      grid.innerHTML = '<p style="padding:20px; color:var(--muted)">Uyğun kanal tapılmadı.</p>';
      allLoaded.style.display = 'none';
      return;
    }

    channels.forEach(channel => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="tv-poster" style="background-image: url('${channel.logo}')"></div>
        <div class="meta">
          <h3 class="title" title="${channel.name}">${channel.name}</h3>
          <span class="tv-badge">${channel.category}</span>
        </div>
      `;

      // Kliklənəndə Video.js Modalını açsın
      card.addEventListener('click', () => {
        openPlayer(channel);
      });

      grid.appendChild(card);
    });

    allLoaded.style.display = 'block';
  }

  // 3. Kanalı pleyerdə açan funksiya
  function openPlayer(channel) {
    playerTitle.textContent = channel.name;
    playerSub.textContent = channel.category;
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');

    // M3U8 və ya fərqli format dəstəyi üçün tip təyini
    let type = 'application/x-mpegURL'; // Standart hls/m3u8
    if (channel.url.includes('.mp4')) type = 'video/mp4';

    player.src({
      src: channel.url,
      type: type
    });

    player.play().catch(error => {
      console.log("Avtomatik oynatma bloklandı, istifadəçi klikləməlidir:", error);
    });
  }

  // 4. Pleyeri və modalı bağlayan funksiya
  function closePlayer() {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    player.pause();
    player.reset(); // Arxa planda şəbəkə data israfının qarşısını almaq üçün mütləqdir
  }

  closeModal.addEventListener('click', closePlayer);
  
  // Modaldan kənara klikləyəndə bağlanma təhlükəsizliyi
  modal.addEventListener('click', (e) => {
    if (e.target === modal) closePlayer();
  });

  // 5. Canlı Axtarış və Filtrasiya Mexanizmi
  function filterChannels() {
    const searchText = searchInput.value.toLowerCase().trim();
    const selectedCategory = genreFilter.value;

    const filtered = allChannels.filter(channel => {
      const matchesSearch = channel.name.toLowerCase().includes(searchText);
      const matchesCategory = selectedCategory === '' || channel.category === selectedCategory;
      return matchesSearch && matchesCategory;
    });

    renderChannels(filtered);
  }

  searchInput.addEventListener('input', filterChannels);
  genreFilter.addEventListener('change', filterChannels);

  // Göndərdiyiniz axtarış düyməsi açılıb/bağlanma animasiya skripti ilə inteqrasiya
  searchBtn.addEventListener('click', () => {
    searchInput.classList.toggle('open');
    if (searchInput.classList.contains('open')) {
      searchInput.focus();
    }
  });

  // Tema tənzimləməsi (Light/Dark mode) — əsas səhifədəki (javascripts.js) məntiqlə BİRƏBİR eynidir:
  // FontAwesome ikon, localStorage ('flix-theme') və loqo rəng dəyişimi.
  // QEYD: Tam javascripts.js faylı bilərəkdən bura bağlanmır, çünki o fayl film grid-i/janr filtri
  // üçün nəzərdə tutulub və tv.html-də olmayan elementlərə (infoBtn, toast) müraciət edərək xəta verir,
  // həmçinin bu səhifədə artıq elan olunmuş eyni adlı (grid, modal və s.) dəyişənləri təkrar elan edib
  // SyntaxError yaradır. Ona görə yalnız tema hissəsi birbaşa bura köçürülüb.
  const logoImg = document.getElementById('logoImg');
  let theme = localStorage.getItem('flix-theme') || 'dark';

  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('flix-theme', t);

    const isDark = t === 'dark';

    if (typeof logoImg !== 'undefined' && logoImg) {
      const color = isDark ? 'white' : 'black';
      logoImg.src = `../FILES/IMG/logos/${color}.png`;
      logoImg.onerror = function() {
        this.src = `FILES/IMG/logos/${color}.png`;
        this.onerror = null;
      };
    }

    if (typeof themeToggle !== 'undefined' && themeToggle) {
      themeToggle.innerHTML = isDark
        ? '<i class="fa-solid fa-sun"></i>'
        : '<i class="fa-solid fa-moon"></i>';
    }
  }

  themeToggle.addEventListener('click', () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    applyTheme(theme);
  });

  applyTheme(theme);

  // Səhifə yüklənəndə işə sal
  document.addEventListener('DOMContentLoaded', loadM3U);
</script>

// Toast — app.js-dəki showToast ilə eyni sistem (sağ yuxarı)
function showToast(message, type = "info") {
  if (!document.getElementById("flix-toast-styles")) {
    const style = document.createElement("style");
    style.id = "flix-toast-styles";
    style.innerHTML = `
      .flix-toast-container {
        position: fixed;
        top: 20px; right: 20px; z-index: 99999;
        display: flex; flex-direction: column; gap: 10px;
        pointer-events: none;
      }
      .flix-toast {
        background: rgba(255,255,255,0.92);
        backdrop-filter: blur(12px);
        color: #1a1a1a;
        padding: 14px 20px;
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.14);
        font-size: 14px; font-weight: 500;
        display: flex; align-items: center; gap: 12px;
        transform: translateX(120%);
        animation: flixSlideIn 0.35s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
        border-left: 5px solid #ccc;
        max-width: 360px;
        pointer-events: auto;
      }
      [data-theme="dark"] .flix-toast {
        background: rgba(28,28,30,0.94);
        color: #fff;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      }
      .flix-toast.success { border-left-color: #2ecc71; }
      .flix-toast.error   { border-left-color: #e74c3c; }
      .flix-toast.warning { border-left-color: #f39c12; }
      .flix-toast.info    { border-left-color: #3498db; }
      @keyframes flixSlideIn { to { transform: translateX(0); } }
      @keyframes flixFadeOut { to { opacity: 0; transform: translateY(-15px); } }
    `;
    document.head.appendChild(style);
  }
  let container = document.querySelector(".flix-toast-container");
  if (!container) {
    container = document.createElement("div");
    container.className = "flix-toast-container";
    document.body.appendChild(container);
  }
  const toast = document.createElement("div");
  toast.className = `flix-toast ${type}`;
  const icons = { success: "✅", error: "❌", warning: "⚠️", info: "💡" };
  toast.innerHTML = `<span>${icons[type] || "💡"}</span><span>${message}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.animation = "flixFadeOut 0.4s forwards";
    setTimeout(() => toast.remove(), 400);
  }, 4000);
}
 
function localizeFirebaseError(err) {
  switch(err.code) {
    case "auth/email-already-in-use": return "Bu e-poçt ünvanı ilə artıq qeydiyyatdan keçilib.";
    case "auth/invalid-credential": return "İstifadəçi adı, e-poçt və ya şifrə yanlışdır.";
    case "auth/weak-password": return "Şifrə çox zəifdir. Ən azı 6 simvoldan ibarət olmalıdır.";
    case "auth/invalid-email": return "Daxil etdiyiniz e-poçt strukturu düzgün deyil.";
    case "auth/user-disabled": return "Hesabınız rəhbərlik tərəfindən deaktiv edilib!";
    case "auth/wrong-password": return "Şifrəniz yanlışdır. Zəhmət olmasa yenidən cəhd edin.";
    case "auth/too-many-requests": return "Çox sayda uğursuz cəhd. Bir qədər gözləyin.";
    case "auth/requires-recent-login": return "Bu əməliyyat üçün yenidən giriş etməlisiniz.";
    case "auth/user-not-found": return "Daxil etdiyiniz e-poçt mövcud deyil.";
    case "auth/cancelled-popup-request": return "Google ilə giriş əməliyyatı dayandırıldı.";
    case "auth/popup-closed-by-user": return "Google ilə giriş əməliyyatı dayandırıldı.";
    default: return err.message || "Gözlənilməz texniki xəta baş verdi.";
  }
}
 
function isValidUsername(str) {
  if (!str) return false;
  const regex = /^[A-Za-z0-9](?!.*\.\.)[A-Za-z0-9._]{1,8}[A-Za-z0-9]$/;
  return regex.test(str);
}
function normalizeUsername(str) { return str.toLowerCase().trim(); }
function isValidName(str) { return /^[\p{L}]+(?:[\s][\p{L}]+)*$/u.test(str.trim()); }

// 4. İSTİFADƏÇİ ADI YOXLAMA
// ============================================================
let usernameCheckTimeout = null;
async function checkUsernameAvailability(username) {
  if (!username) return null;
  const normalized = normalizeUsername(username);
  if (!isValidUsername(normalized)) return false;
  try {
    const q = query(collection(db, 'users'), where('username', '==', normalized));
    const snap = await getDocs(q);
    return snap.empty;
  } catch { return null; }
}
 
regUsername.addEventListener('input', () => {
  clearTimeout(usernameCheckTimeout);
  const val = regUsername.value.trim();
  const normalized = normalizeUsername(val);
  if (!val) { usernameCheckMsg.textContent = ''; usernameCheckMsg.className = 'check-message'; return; }
  if (!isValidUsername(normalized)) {
    usernameCheckMsg.textContent = 'uyğun deyil';
    usernameCheckMsg.className = 'check-message error';
    return;
  }
  usernameCheckMsg.textContent = 'yoxlanılır...';
  usernameCheckMsg.className = 'check-message';
  usernameCheckTimeout = setTimeout(async () => {
    const available = await checkUsernameAvailability(normalized);
    if (available === null) {
      usernameCheckMsg.textContent = 'xəta baş verdi';
      usernameCheckMsg.className = 'check-message error';
    } else if (available) {
      usernameCheckMsg.textContent = 'uyğundur';
      usernameCheckMsg.className = 'check-message success';
    } else {
      usernameCheckMsg.textContent = 'bu istifadəçi adı artıq alınıb';
      usernameCheckMsg.className = 'check-message error';
    }
  }, 400);
});
 
regPasswordConfirm.addEventListener('input', () => {
  const p1 = regPassword.value;
  const p2 = regPasswordConfirm.value;
  if (!p2) { passwordCheckMsg.textContent = ''; passwordCheckMsg.className = 'check-message'; return; }
  if (p1 === p2) {
    passwordCheckMsg.textContent = 'Şifrələr eynidir!';
    passwordCheckMsg.className = 'check-message success';
  } else {
    passwordCheckMsg.textContent = 'Şifrələr eyni deyil!';
    passwordCheckMsg.className = 'check-message error';
  }
});
 
// ============================================================
// 5. LOGIN (EMAIL / USERNAME)
// ============================================================
async function loginWithEmailOrUsername(identifier, password) {
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (emailRegex.test(identifier)) {
    await signInWithEmailAndPassword(auth, identifier, password);
    return;
  }
  const normalized = normalizeUsername(identifier);
  try {
    const q = query(collection(db, 'users'), where('username', '==', normalized));
    const snap = await getDocs(q);
    if (snap.empty) throw { code: 'auth/user-not-found', message: 'İstifadəçi tapılmadı.' };
    const userData = snap.docs[0].data();
    await signInWithEmailAndPassword(auth, userData.email, password);
  } catch (err) {
    if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
      throw { code: 'auth/invalid-credential', message: 'İstifadəçi adı və ya şifrə yanlışdır.' };
    }
    throw err;
  }
}

registerForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const usernameRaw = regUsername.value.trim();
  const username = normalizeUsername(usernameRaw);
  const firstName = regFirstName.value.trim();
  const lastName = regLastName.value.trim();
  const email = regEmail.value.trim();
  const password = regPassword.value;
  const passwordConfirm = regPasswordConfirm.value;
 
  if (!isValidUsername(username)) {
    showToast("İstifadəçi adı qaydalara uyğun deyil (3-10 simvol, yalnız A-Z, 0-9, . _, . başda/sonda olmaz, .. olmaz).", "error");
    return;
  }
  const available = await checkUsernameAvailability(username);
  if (available === false) {
    showToast("Bu istifadəçi adı artıq alınıb.", "error");
    return;
  } else if (available === null) {
    showToast("İstifadəçi adı yoxlanılarkən xəta baş verdi.", "error");
    return;
  }
  if (!isValidName(firstName) || !isValidName(lastName)) {
    showToast("Ad və Soyad yalnız hərflər və boşluqdan ibarət ola bilər.", "error");
    return;
  }
  if (password !== passwordConfirm) {
    showToast("Şifrələr eyni deyil!", "error");
    return;
  }
 
  try {
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const displayName = `${firstName} ${lastName}`.trim();
    await updateProfile(userCredential.user, { displayName, photoURL: "https://kinoflix.github.io/chat/img/avatar.jpg" });
 
    await setDoc(doc(db, 'users', userCredential.user.uid), {
      uid: userCredential.user.uid,
      username,
      firstName,
      lastName,
      displayName,
      email,
      photoURL: "https://kinoflix.github.io/chat/img/avatar.jpg",
      role: 'user',
      isBanned: false,
      createdAt: serverTimestamp()
    });
 
    registerForm.reset();
    usernameCheckMsg.textContent = '';
    passwordCheckMsg.textContent = '';
    showToast("Qeydiyyat uğurla tamamlandı!", "success");
    closeAuthModal.click();
  } catch (err) {
    showToast(localizeFirebaseError(err), "error");
  }
});

// 11. AUTH STATE İZLƏMƏ VƏ UI YENİLƏMƏ
// ============================================================

// Presence və ban izləmə dəyişənləri
let presenceUnsubscribeConnected = null;
let banWatcherUnsubscribe = null;

// Presence qur — istifadəçi chat açmadan belə onlayn görünsün
function setupPresence(user) {
  // Əvvəlki listener-ləri təmizlə
  if (presenceUnsubscribeConnected) {
    presenceUnsubscribeConnected();
    presenceUnsubscribeConnected = null;
  }

  const statusRef = ref(rtdb, `presence/${user.uid}`);

  // RTDB bağlantı statusunu izlə
  const connectedRef = ref(rtdb, '.info/connected');
  const unsubConn = onValue(connectedRef, (snap) => {
    if (snap.val() === true) {
      // Bağlantı kəsildikdə offline yaz
      onDisconnect(statusRef).set({
        status: 'offline',
        lastChanged: rtdbTimestamp()
      }).then(() => {
        // Onlayn olduğunu qeyd et
        set(statusRef, {
          status: 'online',
          lastChanged: rtdbTimestamp()
        });
      });
    }
  });

  // Away timer — 5 dəqiqə aktivlik olmasa "away" göstər
  let isAway = false;
  let idleTimer;
  const resetIdle = () => {
    clearTimeout(idleTimer);
    if (isAway) {
      isAway = false;
      set(statusRef, { status: 'online', lastChanged: rtdbTimestamp() });
    }
    idleTimer = setTimeout(() => {
      isAway = true;
      set(statusRef, { status: 'away', lastChanged: rtdbTimestamp() });
    }, 5 * 60 * 1000);
  };
  resetIdle();
  window.addEventListener('mousemove', resetIdle);
  window.addEventListener('keypress', resetIdle);
  window.addEventListener('touchstart', resetIdle);

  // Unsubscribe saxla
  presenceUnsubscribeConnected = () => {
    unsubConn();
    clearTimeout(idleTimer);
    window.removeEventListener('mousemove', resetIdle);
    window.removeEventListener('keypress', resetIdle);
    window.removeEventListener('touchstart', resetIdle);
  };
}

// Ban izləyicisi — ban gəldikdə əsas səhifədən çıxış et
function setupBanWatcher(user) {
  // Əvvəlki listener-i təmizlə
  if (banWatcherUnsubscribe) {
    banWatcherUnsubscribe();
    banWatcherUnsubscribe = null;
  }

  let isFirstSnapshot = true;
  banWatcherUnsubscribe = onSnapshot(doc(db, 'users', user.uid), async (snapshot) => {
    const wasFirst = isFirstSnapshot;
    isFirstSnapshot = false;

    if (!snapshot.exists()) {
  set(ref(rtdb, `presence/${user.uid}`), { status: 'offline', lastChanged: rtdbTimestamp() });
  showToast("Hesabınız sistemdən silindi!", "error");
  try {
    await deleteUser(user);
  } catch (err) {
    await signOut(auth).catch(() => {});
  }
  setTimeout(() => window.location.reload(), 2000);
  return;
                                     }

    const data = snapshot.data();

    // Ban yoxdursa ilk snapshot-u keç — normal login, yanlış trigger olmasın
    if (wasFirst && !data.isBanned && !data.networkBanned) return;

    if (data.isBanned && data.banExpires) {
      // Müvəqqəti ban
      const expires = data.banExpires.toDate ? data.banExpires.toDate() : new Date(data.banExpires);
      if (expires <= new Date()) {
        // Ban bitib — heç nə etmə
        return;
      }
      const minsLeft = Math.ceil((expires - new Date()) / 60000);
      const dStr = minsLeft < 60
        ? `${minsLeft} dəqiqə`
        : minsLeft < 1440
          ? `${Math.floor(minsLeft / 60)} saat`
          : `${Math.floor(minsLeft / 1440)} gün`;
      showToast(`Hesabınız ${dStr} müddətinə banlandı! Sistemdən çıxarılırsınız.`, "error");
      set(ref(rtdb, `presence/${user.uid}`), { status: 'offline', lastChanged: rtdbTimestamp() });
      await signOut(auth).catch(() => {});
      setTimeout(() => window.location.reload(), 2500);
    } else if (data.isBanned || data.networkBanned) {
      // Daimi ban
      showToast("Hesabınız ban edildi! Sistemdən çıxarılırsınız.", "error");
      set(ref(rtdb, `presence/${user.uid}`), { status: 'offline', lastChanged: rtdbTimestamp() });
      await signOut(auth).catch(() => {});
      setTimeout(() => window.location.reload(), 2500);
    }
  });
}

// Presence-i təmizlə (logout zamanı)
function cleanupPresence(uid) {
  if (uid) {
    set(ref(rtdb, `presence/${uid}`), { status: 'offline', lastChanged: rtdbTimestamp() });
  }
  if (presenceUnsubscribeConnected) {
    presenceUnsubscribeConnected();
    presenceUnsubscribeConnected = null;
  }
  if (banWatcherUnsubscribe) {
    banWatcherUnsubscribe();
    banWatcherUnsubscribe = null;
  }
}

function updateAuthUI(user) {
  const btn = authMainBtn;
  if (user) {
    btn.innerHTML = `<i class="fa-solid fa-right-from-bracket"></i>`;
    btn.title = 'Çıxış';
    btn.onclick = () => {
      if (confirm("Hesabdan çıxmaq istədiyinizə əminsiniz?")) {
        cleanupPresence(user.uid);
        signOut(auth);
        showToast("Hesabdan çıxış edildi.", "info");
      }
    };
  } else {
    btn.innerHTML = `<i class="fa-solid fa-circle-user"></i>`;
    btn.title = 'Hesaba daxil ol';
    btn.onclick = openAuthModal;
  }
}

onAuthStateChanged(auth, async (user) => {
  updateAuthUI(user);
  if (user) {
  // Modal açıqdırsa bağla
  if (authModal.style.display === 'flex') {
    closeAuthModalFunc();
  }

  // 👇 Sənəd yoxlanışı + 2 saniyə gözləmə (Google qeydiyyatı üçün)
  try {
    let userDoc = await getDoc(doc(db, 'users', user.uid));
    if (!userDoc.exists()) {
      await new Promise(resolve => setTimeout(resolve, 2000));
      userDoc = await getDoc(doc(db, 'users', user.uid));
      if (!userDoc.exists()) {
        try {
          await deleteUser(user);
          showToast("Hesabınız sistemdən silindi.", "error");
          window.location.reload();
          return;
        } catch (authError) {
          if (authError.code === 'auth/requires-recent-login') {
            showToast("Təhlükəsizlik doğrulaması tələb olunur. Yenidən daxil olun.", "info");
            await signOut(auth);
            window.location.reload();
            return;
          }
          throw authError;
        }
      }
    }
  } catch (error) {
    if (error.code === 'permission-denied') {
      try {
        const retryDoc = await getDoc(doc(db, 'users', user.uid));
        if (!retryDoc.exists()) {
          await deleteUser(user);
          window.location.reload();
          return;
        }
      } catch (_) {
        await deleteUser(user);
        window.location.reload();
        return;
      }
    }
    console.error("Auth yoxlanışı xətası:", error);
  }

  setupPresence(user);
  setupBanWatcher(user);
} else {
  // Çıxış — presence və ban listener-ləri təmizlə
  cleanupPresence(null);
}
});
