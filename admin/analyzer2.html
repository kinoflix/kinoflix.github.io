<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Dəqiq Film Massivi Analizatoru</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; margin: 20px; color: #333; }
        textarea { width: 100%; height: 350px; font-family: monospace; padding: 10px; box-sizing: border-box; }
        button { padding: 12px 24px; background: #28a745; color: white; border: none; cursor: pointer; font-size: 16px; margin-top: 10px; border-radius: 4px; }
        button:hover { background: #218838; }
        .result { margin-top: 20px; padding: 15px; background: white; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .error { color: #dc3545; font-weight: bold; }
        .success { color: #28a745; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Dəqiq Film Massivi Analizatoru</h2>
    <p>Kodunuzu bütövlüklə bura yapışdırın (kənar kodlar olsa belə, yalnız filmlər süzüləcək):</p>
    <textarea id="codeInput" placeholder="const MOVIES = [ ... ]"></textarea>
    <br>
    <button onclick="analyzeCode()">Dəqiq Analiz Et</button>

    <div class="result" id="output" style="display:none;"></div>

    <script>
        function analyzeCode() {
            const text = document.getElementById('codeInput').value;
            
            // Kod daxilindəki bütün şərhləri tam təmizləyirik
            const cleanText = text.replace(/\/\*[\s\S]*?\*\/|([^\\:]|^)\/\/.*$/gm, '$1');
            
            // Sırf film obyektlərini hədəf alan xüsusi regex ({ title:... })
            // Bu struktur kənar funksiyaları və config obyektlərini tamamilə kənarda qoyur
            const movieRegex = /\{\s*title\s*:\s*[\s\S]*?\}/g;
            const matches = [...cleanText.matchAll(movieRegex)];
            
            let totalMovies = matches.length;
            let addedValues = [];
            let duplicateIds = {};
            let idMap = {};
            
            matches.forEach((match) => {
                const content = match[0];
                
                // ID və Added dəyərlərini çıxarırıq
                const idMatch = content.match(/id\s*:\s*["'`](.*?)["'`]/);
                const addedMatch = content.match(/added\s*:\s*(\d+)/);
                
                if (idMatch) {
                    const id = idMatch[1];
                    if (idMap[id]) {
                        duplicateIds[id] = (duplicateIds[id] || 1) + 1;
                    } else {
                        idMap[id] = true;
                    }
                }
                
                if (addedMatch) {
                    addedValues.push(parseInt(addedMatch[1]));
                }
            });
            
            let maxAdded = addedValues.length > 0 ? Math.max(...addedValues) : 0;
            
            // Çatışmayan added nömrələri (1-dən maxAdded-ə qədər)
            let missingAdded = [];
            for(let i = 1; i <= maxAdded; i++) {
                if(!addedValues.includes(i)) {
                    missingAdded.push(i);
                }
            }
            
            // Təkrarlanan added nömrələri
            let duplicateAdded = [];
            let seenAdded = {};
            addedValues.forEach(v => {
                if(seenAdded[v]) {
                    if(!duplicateAdded.includes(v)) duplicateAdded.push(v);
                } else {
                    seenAdded[v] = true;
                }
            });

            const outputDiv = document.getElementById('output');
            outputDiv.style.display = "block";
            
            let html = `<h3>Dəqiq Analiz Nəticəsi:</h3>`;
            html += `<p><b>Həqiqi tapılan film obyektlərinin sayı:</b> <span class="success">${totalMovies}</span></p>`;
            html += `<p><b>Ən yüksək "added" dəyəri:</b> <b>${maxAdded}</b></p>`;
            
            if (Object.keys(duplicateIds).length > 0) {
                html += `<p class="error">⚠ Təkrarlanan ID-lər var: ${Object.keys(duplicateIds).join(', ')}</p>`;
            } else {
                html += `<p class="success">✓ Super! Təkrarlanan ID tapılmadı.</p>`;
            }
            
            if (duplicateAdded.length > 0) {
                html += `<p class="error">⚠ Təkrarlanan "added" nömrələri var: ${duplicateAdded.join(', ')}</p>`;
            } else {
                html += `<p class="success">✓ Super! Təkrarlanan "added" nömrəsi tapılmadı.</p>`;
            }
            
            if (missingAdded.length > 0) {
                html += `<p class="error">⚠ Arada buraxılmış (istifadə olunmayan) "added" nömrələri var: ${missingAdded.join(', ')}</p>`;
            } else {
                html += `<p class="success">✓ Mükəmməl! 1-dən ${maxAdded}-ə qədər heç bir "added" nömrəsi buraxılmayıb.</p>`;
            }
            
            outputDiv.innerHTML = html;
        }
    </script>
</body>
</html>
