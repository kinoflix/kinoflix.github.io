<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Canlı Film Massivi Analizatoru</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; background: #141414; color: white; text-align: center; }
        .container { background: #222; padding: 30px; border-radius: 10px; max-width: 650px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #E50914; margin-bottom: 10px; }
        p { color: #aaa; font-size: 14px; line-height: 1.6; }
        .input-group { margin: 25px 0; }
        input[type="url"] { width: 85%; padding: 12px; background: #333; border: 1px solid #555; border-radius: 5px; color: white; font-size: 15px; outline: none; transition: 0.3s; }
        input[type="url"]:focus { border-color: #E50914; box-shadow: 0 0 5px rgba(229, 9, 20, 0.5); }
        button { background: #E50914; color: white; border: none; padding: 12px 30px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.2s; margin-top: 10px; }
        button:hover { background: #b80710; transform: scale(1.02); }
        .result-box { margin-top: 25px; background: #1a1a1a; padding: 20px; border-radius: 8px; text-align: left; display: none; border-left: 5px solid #E50914; }
        .result-item { font-size: 16px; margin-bottom: 10px; color: #ddd; }
        .result-item b { color: #fff; font-size: 18px; }
        .error { color: #ff3333; font-weight: bold; }
        .loader { display: none; margin: 15px auto; border: 4px solid #333; border-radius: 50%; border-top: 4px solid #E50914; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h2>Canlı Film Analizatoru</h2>
    <p>Saytınızdakı film datalarının linkini (məsələn: <code>massiv.txt</code> və ya JS faylının birbaşa URL-ni) bura daxil edin. Sistem canlı olaraq ümumi film sayını və ən yüksək <b>added</b> dəyərini hesablayacaq.</p>
    
    <div class="input-group">
        <input type="url" id="urlInput" placeholder="https://kinoflix.github.io/massiv.txt" required>
        <br>
        <button id="analyzeBtn">İndi Analiz Et</button>
    </div>

    <div class="loader" id="loader"></div>

    <div class="result-box" id="resultBox">
        <div class="result-item">📊 Faylın Durumu: <span id="statusText" style="color: #2ecc71; font-weight: bold;">Uğurlu</span></div>
        <div class="result-item">🎬 Ümumi Film Sayı: <b id="totalMovies">0</b></div>
        <div class="result-item">🔥 Ən Yüksək "added" Dəyəri: <b id="maxAdded" style="color: #e74c3c;">0</b></div>
    </div>
</div>

<script>
document.getElementById('analyzeBtn').addEventListener('click', async () => {
    const urlInput = document.getElementById('urlInput').value.trim();
    const loader = document.getElementById('loader');
    const resultBox = document.getElementById('resultBox');
    
    if (!urlInput) {
        alert('Zəhmət olmasa düzgün bir URL daxil edin!');
        return;
    }

    // UI təmizlənməsi və yüklənmə animasiyası
    loader.style.display = 'block';
    resultBox.style.display = 'none';

    try {
        // Canlı olaraq linkdəki mətni çəkirik
        const response = await fetch(urlInput);
        if (!response.ok) {
            throw new Error(`Fayl tapılmadı və ya yüklənmədi (Status: ${response.status})`);
        }
        
        let text = await response.text();
        text = text.trim();

        // JS massiv strukturunu təmizləyib oxunaqlı formata salırıq
        let arrayString = text;
        if (arrayString.startsWith('const MOVIES =')) {
            arrayString = arrayString.replace('const MOVIES =', '');
        }
        if (arrayString.endsWith(';')) {
            arrayString = arrayString.slice(0, -1);
        }

        // Mətni təhlükəsiz şəkildə JS obyektinə (massivə) çeviririk
        const movies = new Function(`return ${arrayString};`)();

        if (!Array.isArray(movies)) {
            throw new Error("Daxil edilən linkdə düzgün film massivi strukturu tapılmadı.");
        }

        // 1. Ümumi film sayının tapılması
        const totalCount = movies.length;

        // 2. Ən böyük added dəyərinin tapılması
        let highestAdded = 0;
        movies.forEach(movie => {
            let val = parseFloat(movie.added) || 0;
            if (val > highestAdded) {
                highestAdded = val;
            }
        });

        // Nəticələrin ekranda göstərilməsi
        document.getElementById('statusText').innerText = "Uğurlu (Məlumatlar oxundu)";
        document.getElementById('statusText').className = "";
        document.getElementById('totalMovies').innerText = totalCount + " ədəd film";
        document.getElementById('maxAdded').innerText = highestAdded;
        
        resultBox.style.display = 'block';

    } catch (err) {
        // Xəta idarəetməsi (Məsələn CORS bloklanması və ya yanlış link daxil edildikdə)
        document.getElementById('statusText').innerText = "Xəta baş verdi!";
        document.getElementById('statusText').className = "error";
        document.getElementById('totalMovies').innerText = "Hesablanamadı";
        document.getElementById('maxAdded').innerText = "Hesablanamadı";
        
        alert("Xəta təfərrüatı: " + err.message + "\n\nQeyd: Linkin birbaşa .txt və ya .js datasına yönəldiyindən əmin olun.");
        resultBox.style.display = 'block';
    } finally {
        loader.style.display = 'none';
    }
});
</script>
</body>
</html>
