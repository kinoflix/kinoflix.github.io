<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Xətalara Dözümlü Canlı Film Analizatoru</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; background: #141414; color: white; text-align: center; }
        .container { background: #222; padding: 30px; border-radius: 10px; max-width: 650px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #E50914; margin-bottom: 10px; }
        p { color: #aaa; font-size: 14px; line-height: 1.6; }
        .input-group { margin: 25px 0; }
        input[type="url"] { width: 85%; padding: 12px; background: #333; border: 1px solid #555; border-radius: 5px; color: white; font-size: 15px; outline: none; transition: 0.3s; }
        input[type="url"]:focus { border-color: #E50914; box-shadow: 0 0 5px rgba(229, 9, 20, 0.5); }
        button { background: #E50914; color: white; border: none; padding: 12px 30px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.2s; margin-top: 10px; }
        button:hover { background: #b80710; transform: scale(1.02); }
        .result-box { margin-top: 25px; background: #1a1a1a; padding: 20px; border-radius: 8px; text-align: left; display: none; border-left: 5px solid #2ecc71; }
        .result-item { font-size: 16px; margin-bottom: 10px; color: #ddd; }
        .result-item b { color: #fff; font-size: 18px; }
        .loader { display: none; margin: 15px auto; border: 4px solid #333; border-radius: 50%; border-top: 4px solid #E50914; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h2>Zirehli Film Analizatoru (v2.0)</h2>
    <p>JS və ya TXT linkini daxil edin. Bu sistem brauzerin kod mühərriklərindən imtina edərək mətni birbaşa ağıllı skanerlə oxuyur. Sintaksis və mötərizə xətalarından tamamilə qorunub.</p>
    
    <div class="input-group">
        <input type="url" id="urlInput" placeholder="Məsələn: https://github.com/... /massiv.js" required>
        <br>
        <button id="analyzeBtn">İndi Analiz Et</button>
    </div>

    <div class="loader" id="loader"></div>

    <div class="result-box" id="resultBox">
        <div class="result-item">📊 Faylın Durumu: <span id="statusText">Gözlənilir</span></div>
        <div class="result-item">🎬 Ümumi Film Sayı: <b id="totalMovies">0</b></div>
        <div class="result-item">🔥 Ən Yüksək "added" Dəyəri: <b id="maxAdded" style="color: #e74c3c;">0</b></div>
    </div>
</div>

<script>
document.getElementById('analyzeBtn').addEventListener('click', async () => {
    let urlInput = document.getElementById('urlInput').value.trim();
    const loader = document.getElementById('loader');
    const resultBox = document.getElementById('resultBox');
    
    if (!urlInput) {
        alert('Zəhmət olmasa düzgün bir URL daxil edin!');
        return;
    }

    // GitHub normal keçidini RAW formatına avtomatik çeviririk
    if (urlInput.includes('github.com') && urlInput.includes('/blob/')) {
        urlInput = urlInput.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
    }

    loader.style.display = 'block';
    resultBox.style.display = 'none';

    try {
        const response = await fetch(urlInput);
        if (!response.ok) {
            throw new Error(`Fayl yüklənmədi. Status: ${response.status}`);
        }
        
        const text = await response.text();

        // 🚀 SMART REGEX PARSER (KOD XƏTALARINA QARŞI 100% TOXUNULMAZLIQ):
        // 1. Fayldakı bütün növ şərhləri (comments) silirik ki, dataya mane olmasın
        let cleanText = text.replace(/\/\*[\s\S]*?\*\/|([^\\:]|^)\/\/.*$/gm, '$1');

        // 2. { ... } arasındakı bütün film bloklarını müstəqil şəkildə tapırıq
        const objectRegex = /\{([\s\S]*?)\}/g;
        const matches = [...cleanText.matchAll(objectRegex)];
        const movies = [];

        matches.forEach(match => {
            const objContent = match[1];
            
            // Xüsusi xassə təmizləyicisi (dırnaqlı, dırnaqsız və sətir qırılmalı bütün mətnləri oxuyur)
            const getValue = (key) => {
                // key: "value", key: 'value' və ya key: value formatlarını ssenaridən asılı olmayaraq çəkir
                const regex = new RegExp(key + '\\s*:\\s*(["\'`]?)([\\s\\S]*?)\\1\\s*(?:,|$|})');
                const res = objContent.match(regex);
                return res ? res[2].trim() : "";
            };

            const title = getValue("title");
            const id = getValue("id");
            
            // Əgər obyekt daxilində 'title' və ya 'id' tapılıbsa, deməli bu real film qeydidir
            if (title || id) {
                const addedRaw = getValue("added");
                const added = parseFloat(addedRaw) || 0;
                
                movies.push({
                    title: title,
                    id: id,
                    added: added
                });
            }
        });

        if (movies.length === 0) {
            throw new Error("Fayl daxilində oxunula bilən hər hansı bir film strukturu tapılmadı.");
        }

        // Hesablamalar (Maksimum added dəyərinin tapılması)
        const totalCount = movies.length;
        let highestAdded = 0;
        
        movies.forEach(movie => {
            if (movie.added > highestAdded) {
                highestAdded = movie.added;
            }
        });

        // Vizuallaşdırma
        document.getElementById('statusText').innerText = "Uğurlu (Sintaksis xətaları bypass edildi)";
        document.getElementById('statusText').style.color = "#2ecc71";
        document.getElementById('resultBox').style.borderColor = "#2ecc71";
        document.getElementById('totalMovies').innerText = totalCount + " ədəd film";
        document.getElementById('maxAdded').innerText = highestAdded;
        
        resultBox.style.display = 'block';

    } catch (err) {
        document.getElementById('statusText').innerText = "Xəta: " + err.message;
        document.getElementById('statusText').style.color = "#ff3333";
        document.getElementById('resultBox').style.borderColor = "#ff3333";
        document.getElementById('totalMovies').innerText = "---";
        document.getElementById('maxAdded').innerText = "---";
        resultBox.style.display = 'block';
    } finally {
        loader.style.display = 'none';
    }
});
</script>
</body>
</html>
