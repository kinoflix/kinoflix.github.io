<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINOFLIX - Real-vaxt Serverless Çat</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath fill='%231db954' d='M27.5 162.2L9 187.1h90.5l6.9-130.7-78.9 105.8zM396.3 45.7L267.7 32l135.7 147.2-7.1-133.5zM112.2 218.3l-11.2-22H9.9L234.8 458zm2-31.2h284l-81.5-88.5L256.3 33zm297.3 9.1L277.6 458l224.8-261.7h-90.9zM415.4 69L406 56.4l.9 17.3 6.1 113.4h90....">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <div id="authScreen" class="screen active">
        <div class="auth-container">
            <div class="auth-logo">
                <i class="fa-solid fa-play"></i> KINOFLIX
            </div>
            <form id="loginForm">
                <h2>Giriş</h2>
                <div class="input-group">
                    <label for="loginEmail">E-poçt</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="input-group">
                    <label for="loginPassword">Şifrə</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="btn-primary">Daxil ol</button>
            </form>
        </div>
    </div>

    <div id="chatScreen" class="screen">
        <div class="app-container">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h3>Aktiv İstifadəçilər</h3>
                    <div class="user-controls">
                        <span id="currentUserRole" class="role-badge"></span>
                        <button id="openSettingsBtn" class="icon-btn hidden" title="Tənzimləmələr"><i class="fa-solid fa-gear"></i></button>
                        <button id="logoutBtn" class="icon-btn hidden" title="Çıxış"><i class="fa-solid fa-sign-out-alt"></i></button>
                    </div>
                </div>
                <ul id="userList" class="user-list">
                    </ul>
            </aside>

            <main class="chat-area">
                <div class="chat-header">
                    <h2 id="roomTitle">Ümumi Çat</h2>
                    <button id="closePrivateBtn" class="hidden"><i class="fa-solid fa-times"></i> Bağla</button>
                </div>

                <div id="messagesContainer" class="messages-container">
                    </div>

                <div class="chat-input-wrapper">
                    <div id="filePreviewContainer" class="hidden">
                        <img id="filePreviewImg" src="" alt="Seçilmiş fayl">
                        <button id="removeFileBtn" type="button"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    
                    <form id="messageForm" class="message-form">
                        <label for="chatFileInput" class="attach-btn" title="Fayl əlavə et">
                            <i class="fa-solid fa-paperclip"></i>
                        </label>
                        <input type="file" id="chatFileInput" accept="image/*" hidden>
                        
                        <input type="text" id="chatInput" placeholder="Mesajınızı yazın..." autocomplete="off">
                        
                        <button type="submit" id="sendBtn" class="send-btn">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <div id="settingsModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Profil Tənzimləmələri</h2>
            <div class="settings-body">
                <form id="settingsForm">
                    <div class="input-group">
                        <label for="settingsName">Ad Soyad:</label>
                        <input type="text" id="settingsName" placeholder="Ad və Soyadınız">
                    </div>
                    <div class="input-group">
                        <label for="settingsEmail">E-poçt ünvanı:</label>
                        <input type="email" id="settingsEmail" placeholder="E-poçt ünvanı">
                    </div>
                    <div class="input-group">
                        <label for="settingsNewPassword">Yeni Şifrə (Dəyişmək istəyirsinizsə):</label>
                        <input type="password" id="settingsNewPassword" placeholder="Yeni şifrə daxil edin">
                    </div>
                    <div class="input-group auth-divider-group">
                        <label for="settingsCurrentPassword" style="color: var(--danger); font-size: 0.8rem; margin-top: 10px;">E-poçt və ya Şifrə yeniləmək üçün mövcud şifrənizi daxil etməyiniz məcburidir!</label>
                        <input type="password" id="settingsCurrentPassword" placeholder="Cari şifrəniz">
                    </div>
                    <button type="submit" class="save-settings-btn">Dəyişiklikləri Yadda Saxla</button>
                </form>
                
                <div class="danger-zone">
                    <h4>Hesabın Silinməsi</h4>
                    <p>Hesabınızı sildiyiniz təqdirdə bütün profil məlumatlarınız çat sistemindən tamamilə təmizlənəcək.</p>
                    <button id="deleteAccBtn" class="delete-account-btn">
                        <i class="fa-solid fa-user-xmark"></i> Hesabımı Sil
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
