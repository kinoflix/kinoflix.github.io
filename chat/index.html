<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINOFLIX - Real-vaxt Serverless Çat</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath fill='%231db954' d='M27.5 162.2L9 187.1h90.5l6.9-130.7-78.9 105.8zM396.3 45.7L267.7 32l135.7 147.2-7.1-133.5zM112.2 218.3l-11.2-22H9.9L234.8 458zm2-31.2h284l-81.5-88.5L256.3 33zm297.3 9.1L277.6 458l224.8-261.7h-90.9zM415.4 69L406 56.4l.9 17.3 6.1 113.4h90.3zM113.5 93.5l-4.6 85.6L244.7 32 116.1 45.7zm287.7 102.7h-290l42.4 82.9L256.3 480l144.9-283.8z'/%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css?family=Varela+Round" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body data-theme="dark">

    <header class="app-header">
        <div class="logo-area">
            <a href="#" class="logo">
                <img id="siteLogo" src="../FILES/IMG/logos/white.png" alt="KINOFLIX">
            </a>
        </div>
        <div class="header-actions">
            <button id="themeToggle" class="icon-btn" title="Mövzunu dəyiş">
                <i class="fa-solid fa-sun"></i>
            </button>
            <button id="openSettingsBtn" class="icon-btn hidden" title="Profil Tənzimləmələri">
                <i class="fa-solid fa-gear"></i>
            </button>
            <button id="logoutBtn" class="logout-btn hidden">
                <i class="fa-solid fa-right-from-bracket"></i> Çıxış
            </button>
        </div>
    </header>

    <main class="main-container">

        <section id="authScreen" class="auth-screen active">
            <div class="auth-card">
                <div class="auth-tabs">
                    <button id="tabLogin" class="auth-tab active">Daxil Ol</button>
                    <button id="tabRegister" class="auth-tab">Qeydiyyat</button>
                </div>

                <form id="loginForm" class="auth-form active">
                    <h2>Xoş Gəldiniz</h2>
                    <div class="input-group">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="loginEmail" placeholder="E-poçt ünvanı" required>
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="Şifrə" required>
                    </div>
                    <button type="submit" class="submit-btn">Sistemə Gir</button>
                </form>

                <form id="registerForm" class="auth-form">
                    <h2>Hesab Yarat</h2>
                    <div class="input-group">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="regName" placeholder="İstifadəçi adı (Ləqəb)" required>
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="regEmail" placeholder="E-poçt ünvanı" required>
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="regPassword" placeholder="Şifrə (Min. 6 simvol)" required>
                    </div>
                    <button type="submit" class="submit-btn">Qeydiyyatı Tamamla</button>
                </form>

                <div class="auth-divider"><span>və ya</span></div>

                <button id="googleAuthBtn" class="google-btn">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
                    Google ilə davam et
                </button>
            </div>
        </section>

        <section id="chatScreen" class="chat-screen">
            <div class="chat-layout">
                
                <aside class="sidebar">
                    <div class="current-user-card">
                        <img id="currentUserAvatar" src="https://via.placeholder.com/40" alt="Avatar" class="avatar">
                        <div class="user-info">
                            <span id="currentUserName" class="name">Yüklənir...</span>
                            <span id="currentUserRole" class="role-badge">İstifadəçi</span>
                        </div>
                    </div>

                    <div class="sidebar-navigation">
                        <button id="btnGlobalRoom" class="nav-tab active">
                            <i class="fa-solid fa-earth-americas"></i> Ümumi Çat
                        </button>
                    </div>

                    <div class="sidebar-list-container">
                        <h3><i class="fa-solid fa-circle text-success"></i> Aktiv İstifadəçilər</h3>
                        <ul id="usersList" class="users-list"></ul>
                    </div>
                </aside>

                <section class="chat-window">
                    <div class="chat-window-header">
                        <div class="active-room-info">
                            <h2 id="activeRoomTitle">Ümumi Çat</h2>
                            <p id="activeRoomSub">Son 50 mesaj göstərilir</p>
                        </div>
                    </div>

                    <div id="chatMessagesArea" class="chat-messages-area"></div>

                    <div id="typingIndicator" class="typing-indicator hidden">
                        <span id="typingText">Kimsə yazır...</span>
                        <div class="dots"><span></span><span></span><span></span></div>
                    </div>

                    <div class="chat-input-bar">
                        <label for="chatFileInput" class="attach-btn" title="Fayl və ya Şəkil göndər">
                            <i class="fa-solid fa-paperclip"></i>
                            <input type="file" id="chatFileInput" accept="image/*, application/pdf, text/plain" hidden>
                        </label>
                        <input type="text" id="messageInputField" placeholder="Mesajınızı yazın..." autocomplete="off">
                        <button id="sendMessageBtn" class="send-btn">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </section>

            </div>
        </section>

    </main>

    <div id="settingsModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Profil Ayarları</h3>
                <button id="closeSettingsBtn" class="close-modal-btn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="profileSettingsForm">
                    <div class="avatar-upload-wrapper">
                        <img id="settingsAvatarPreview" src="https://via.placeholder.com/100" alt="Avatar" class="large-avatar">
                        <label for="avatarFileInput" class="avatar-edit-label">
                            <i class="fa-solid fa-camera"></i> Şəkil Seç
                        </label>
                        <input type="file" id="avatarFileInput" accept="image/*" hidden>
                    </div>
                    <div class="input-group">
                        <label for="settingsDisplayName">Görünən Adınız:</label>
                        <input type="text" id="settingsDisplayName" placeholder="Yeni ləqəb" required>
                    </div>
                    <button type="submit" class="save-settings-btn">Dəyişiklikləri Yadda Saxla</button>
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
