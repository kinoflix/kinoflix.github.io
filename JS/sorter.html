<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Film Massivi Sıralayıcı</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; background: #141414; color: white; text-align: center; }
        .container { background: #222; padding: 30px; border-radius: 10px; max-width: 600px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #E50914; margin-bottom: 10px; }
        p { color: #aaa; font-size: 14px; line-height: 1.6; }
        input[type="file"] { margin: 20px 0; padding: 10px; background: #333; border: 1px dashed #555; border-radius: 5px; color: white; cursor: pointer; width: 80%; }
        button { background: #E50914; color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.2s; }
        button:hover { background: #b80710; transform: scale(1.03); }
        .footer { margin-top: 20px; font-size: 12px; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h2>Film Massivi Sıralayıcı</h2>
    <p>Bu alət <b>massiv.txt</b> faylındakı bütün dataları, şəkil və qaynaq linklərini toxunulmaz saxlayaraq illərə görə sıralayır və hər birinə random <b>added</b> dəyəri əlavə edir.</p>
    
    <input type="file" id="fileInput" accept=".txt"><br>
    <button id="processBtn">Sırala və Yeni Faylı Yüklə</button>
    <div class="footer">Datalarınız tamamilə lokal olaraq brauzerdə emal edilir.</div>
</div>

<script>
document.getElementById('processBtn').addEventListener('click', () => {
    const fileInput = document.getElementById('fileInput');
    if (!fileInput.files[0]) {
        alert('Zəhmət olmasa əvvəlcə massiv.txt faylını seçin!');
        return;
    }
    
    const file = fileInput.files[0];
    const reader = new FileReader();
    
    reader.onload = function(e) {
        let text = e.target.result.trim();
        
        try {
            // Massiv sətirini təmizləyirik
            let arrayString = text;
            if (arrayString.startsWith('const MOVIES =')) {
                arrayString = arrayString.replace('const MOVIES =', '');
            }
            if (arrayString.endsWith(';')) {
                arrayString = arrayString.slice(0, -1);
            }
            
            // Təhlükəsiz şəkildə massiv obyektinə çeviririk
            const movies = new Function(`return ${arrayString};`)();
            
            if (!Array.isArray(movies)) {
                throw new Error("Fayl daxilində düzgün massiv strukturu tapılmadı.");
            }
            
            // 1. İllərə görə sıralayırıq (Köhnədən yeniyə)
            // Siyahıdakı "2000, 2016, 2019" kimi string tipli illəri də ilk ili əsas götürərək düzgün sıralayır
            movies.sort((a, b) => {
                let yearA = parseFloat(a.year);
                let yearB = parseFloat(b.year);
                return yearA - yearB;
            });
            
            // 2. Random 'added' dəyəri əlavə edirik (Məsələn: 1-100 arası tam rəqəm)
            movies.forEach(movie => {
                movie.added = Math.floor(Math.random() * 100) + 1;
            });
            
            // Obyekt strukturunu, bütün linkləri və dırnaqları qoruyaraq yenidən JS faylı formatına salırıq
            let outputText = "const MOVIES = [\n";
            movies.forEach((m, idx) => {
                outputText += "  { ";
                let keys = Object.keys(m);
                let parts = keys.map(k => {
                    let val = m[k];
                    if (typeof val === 'string') {
                        // Linkləri və mətnləri JSON qaydalarına uyğun təhlükəsiz dırnağa alırıq
                        return `${k}:${JSON.stringify(val)}`;
                    }
                    return `${k}:${val}`;
                });
                outputText += parts.join(", ");
                outputText += " }" + (idx < movies.length - 1 ? ",\n" : "\n");
            });
            outputText += "];";
            
            // Yeni düzənlənmiş .txt faylını avtomatik yükləyirik
            const blob = new Blob([outputText], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'siralanmis_massiv.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            alert('Uğurlu! Bütün datalar qorundu, illərə görə sıralandı və yeni fayl (siralanmis_massiv.txt) yüklənildi.');
            
        } catch(err) {
            alert('Xəta baş verdi! Fayl strukturunun düzgün "const MOVIES = [...]" formatında olduğundan əmin olun. Xəta: ' + err.message);
        }
    };
    
    reader.readAsText(file);
});
</script>
</body>
</html>
