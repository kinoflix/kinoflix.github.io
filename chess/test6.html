<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiplayer Şahmat - Firestore</title>
    <!-- Chessboard.js -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" />
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    
    <!-- Chess.js - 3 ehtiyat CDN -->
    <script>
        // Chess.js üçün ilk cəhd
        function loadChessJS() {
            return new Promise((resolve, reject) => {
                // Əgər artıq yüklənibsə
                if (typeof Chess !== 'undefined') {
                    resolve();
                    return;
                }
                // CDN siyahısı
                const cdnList = [
                    'https://cdnjs.cloudflare.com/ajax/libs/chess.js/1.0.0-beta.6/chess.min.js',
                    'https://unpkg.com/chess.js@1.0.0-beta.6/chess.min.js',
                    'https://cdn.jsdelivr.net/npm/chess.js@1.0.0-beta.6/dist/chess.min.js'
                ];
                let index = 0;
                function tryLoad() {
                    if (index >= cdnList.length) {
                        reject('Bütün CDN-lər uğursuz oldu');
                        return;
                    }
                    const script = document.createElement('script');
                    script.src = cdnList[index];
                    script.onload = () => {
                        if (typeof Chess !== 'undefined') {
                            resolve();
                        } else {
                            index++;
                            tryLoad();
                        }
                    };
                    script.onerror = () => {
                        index++;
                        tryLoad();
                    };
                    document.head.appendChild(script);
                }
                tryLoad();
            });
        }
    </script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #1e1e2f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #eee;
            flex-direction: column;
        }
        .container {
            background: #2a2a3c;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 { font-size: 24px; margin-bottom: 10px; color: #f0d9b5; }
        .status {
            background: #3a3a4e;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            margin: 10px 0;
            display: inline-block;
        }
        #board {
            width: 100%;
            max-width: 460px;
            margin: 10px auto;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        input, button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            background: #3f3f57;
            color: #fff;
        }
        input {
            flex: 1;
            min-width: 120px;
            background: #1e1e2f;
            border: 1px solid #555;
        }
        button {
            cursor: pointer;
            background: #6c5b7b;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background: #8a7a9a; transform: scale(1.02); }
        button:active { transform: scale(0.98); }
        .btn-primary { background: #4a6fa5; }
        .btn-primary:hover { background: #5f8bc9; }
        .btn-danger { background: #a54a4a; }
        .btn-danger:hover { background: #c95f5f; }
        #roomIdDisplay {
            background: #1e1e2f;
            padding: 6px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 18px;
            letter-spacing: 2px;
            margin: 5px 0;
        }
        .players { font-size: 13px; opacity: 0.8; margin: 5px 0; }
        .footer { margin-top: 15px; font-size: 12px; opacity: 0.5; }
        #errorBox {
            background: #a54a4a;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            margin: 10px 0;
            display: none;
            font-size: 13px;
        }
        #loading {
            color: #f0d9b5;
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>♟️ Online Şahmat</h1>
    <div id="errorBox"></div>
    <div id="loading">⏳ Kitabxanalar yüklənir...</div>
    <div class="status" id="status">Hazır deyil</div>
    <div id="board"></div>

    <div id="roomInfo">
        <div id="roomIdDisplay">-</div>
        <div class="players" id="playerInfo">Ağ: Gözlənilir | Qara: Gözlənilir</div>
    </div>

    <div class="controls">
        <button class="btn-primary" id="createBtn" disabled>✨ Otaq Yarat</button>
        <input type="text" id="joinInput" placeholder="Otaq ID daxil et" disabled />
        <button class="btn-primary" id="joinBtn" disabled>🔗 Qoşul</button>
        <button class="btn-danger" id="leaveBtn" disabled>🚪 Çıx</button>
    </div>
    <div class="footer">Bütün hərəkətlər real-time sinxronlaşır (Firestore)</div>
</div>

<script>
    // ============================================================
    // 0. XƏTA GÖSTƏRİCİ
    // ============================================================
    const errorBox = document.getElementById('errorBox');
    function showError(msg) {
        errorBox.textContent = '❌ ' + msg;
        errorBox.style.display = 'block';
        console.error(msg);
    }

    // ============================================================
    // 1. KİTABXANALARI YÜKLƏ
    // ============================================================
    async function initApp() {
        try {
            // Chess.js yüklə
            await loadChessJS();
            console.log('✅ Chess.js yükləndi');

            // Chessboard.js artıq yüklənib, yoxlayaq
            if (typeof Chessboard === 'undefined') {
                throw new Error('Chessboard.js yüklənmədi');
            }
            console.log('✅ Chessboard.js yükləndi');

            // Firebase yoxlama
            if (typeof firebase === 'undefined' || !firebase.firestore) {
                throw new Error('Firebase SDK yüklənmədi');
            }
            console.log('✅ Firebase yükləndi');

            // Yükləmə mesajını sil
            document.getElementById('loading').style.display = 'none';

            // İndi əsas kodu işə sal
            startGame();

        } catch (err) {
            showError('Kitabxana yükləmə xətası: ' + err.message);
            document.getElementById('loading').textContent = '❌ Yükləmə uğursuz, səhifəni yeniləyin';
        }
    }

    // ============================================================
    // 2. ƏSAS OYUN KODU
    // ============================================================
    function startGame() {
        try {
            // Firestore konfiqurasiyası
            const firebaseConfig = {
                apiKey: "AIzaSyB45Kfc8_0DvEUGWlbKIqxYrRmM_HM5ZjE",
                authDomain: "kinoflixchess.firebaseapp.com",
                projectId: "kinoflixchess",
                storageBucket: "kinoflixchess.firebasestorage.app",
                messagingSenderId: "34532322738",
                appId: "1:34532322738:web:07d5f11799c4fdb0e908ab"
            };

            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            const db = firebase.firestore();
            console.log('✅ Firestore bağlantısı quruldu');

            // Oyun dəyişənləri
            let game = new Chess();
            let board = null;
            let currentRoomId = null;
            const playerId = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substr(2, 9);
            let myColor = null;
            let isGameOver = false;
            let isSyncing = false;
            let unsubscribe = null;

            // DOM
            const statusEl = document.getElementById('status');
            const roomIdDisplay = document.getElementById('roomIdDisplay');
            const playerInfoEl = document.getElementById('playerInfo');
            const createBtn = document.getElementById('createBtn');
            const joinBtn = document.getElementById('joinBtn');
            const joinInput = document.getElementById('joinInput');
            const leaveBtn = document.getElementById('leaveBtn');

            // Board
            board = Chessboard('board', {
                draggable: true,
                position: 'start',
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd
            });
            console.log('✅ Board quruldu');

            // Butonları aktiv et
            createBtn.disabled = false;
            joinBtn.disabled = false;
            joinInput.disabled = false;
            leaveBtn.disabled = false;

            // ============================================================
            // GEDİŞ MƏNTİQİ
            // ============================================================
            function onDragStart(source, piece, position, orientation) {
                if (isGameOver) return false;
                if (myColor === null) return false;
                const pieceColor = piece.charAt(0);
                if ((myColor === 'white' && pieceColor !== 'w') ||
                    (myColor === 'black' && pieceColor !== 'b')) {
                    return false;
                }
                if (isSyncing) return false;
                return true;
            }

            function onDrop(source, target) {
                try {
                    const move = game.move({
                        from: source,
                        to: target,
                        promotion: 'q'
                    });
                    if (move === null) return 'snapback';

                    saveGameStateToFirestore();
                    updateUI();
                } catch (e) {
                    showError('Gediş xətası: ' + e.message);
                    return 'snapback';
                }
            }

            function onSnapEnd() {
                board.position(game.fen());
            }

            // ============================================================
            // FIRESTORE ƏMƏLİYYATLARI
            // ============================================================
            function saveGameStateToFirestore() {
                if (!currentRoomId) return;
                const gameRef = db.collection('games').doc(currentRoomId);
                gameRef.update({
                    fen: game.fen(),
                    turn: game.turn(),
                    lastMoveBy: playerId,
                    players: {
                        white: (myColor === 'white') ? playerId : null,
                        black: (myColor === 'black') ? playerId : null
                    },
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }).catch(err => showError('Firestore yeniləmə xətası: ' + err.message));
            }

            function listenToRoom(roomId) {
                if (unsubscribe) {
                    unsubscribe();
                    unsubscribe = null;
                }

                const gameRef = db.collection('games').doc(roomId);
                unsubscribe = gameRef.onSnapshot((docSnapshot) => {
                    try {
                        if (!docSnapshot.exists) {
                            statusEl.textContent = '❌ Otaq tapılmadı';
                            return;
                        }
                        const data = docSnapshot.data();
                        isSyncing = true;

                        const whiteId = data.players?.white || null;
                        const blackId = data.players?.black || null;

                        if (whiteId === playerId) myColor = 'white';
                        else if (blackId === playerId) myColor = 'black';
                        else {
                            if (whiteId === null) {
                                myColor = 'white';
                                gameRef.update({ 'players.white': playerId });
                            } else if (blackId === null) {
                                myColor = 'black';
                                gameRef.update({ 'players.black': playerId });
                            } else {
                                myColor = null;
                                statusEl.textContent = '👀 Oyun tamdır, tamaşa edirsiniz';
                            }
                        }

                        if (data.fen) {
                            try {
                                game.load(data.fen);
                                board.position(data.fen);
                            } catch (e) {
                                console.warn('FEN yüklənmədi', e);
                                game = new Chess();
                                board.position('start');
                            }
                        }

                        isGameOver = game.game_over();
                        if (isGameOver) {
                            if (game.in_checkmate()) {
                                statusEl.textContent = '🏆 Şahmat! ' + (game.turn() === 'w' ? 'Qara' : 'Ağ') + ' qazandı!';
                            } else if (game.in_draw()) {
                                statusEl.textContent = '🤝 Heç-heçə';
                            } else {
                                statusEl.textContent = '⏹️ Oyun bitdi';
                            }
                        } else {
                            const turnText = game.turn() === 'w' ? 'Ağ' : 'Qara';
                            statusEl.textContent = `🎯 Növbə: ${turnText}`;
                        }

                        updateUI();
                        isSyncing = false;
                    } catch (e) {
                        showError('Snapshot emal xətası: ' + e.message);
                        isSyncing = false;
                    }
                }, (error) => {
                    showError('Firestore listener xətası: ' + error.message);
                });
            }

            // ============================================================
            // İNTERFEYS
            // ============================================================
            function updateUI() {
                roomIdDisplay.textContent = currentRoomId || '-';
                if (myColor) {
                    playerInfoEl.textContent = `Siz: ${myColor === 'white' ? '♔ Ağ' : '♚ Qara'}`;
                } else {
                    playerInfoEl.textContent = currentRoomId ? '👤 Tamaşaçı' : 'Otaq seçin';
                }

                if (currentRoomId) {
                    createBtn.disabled = true;
                    joinBtn.disabled = true;
                    joinInput.disabled = true;
                } else {
                    createBtn.disabled = false;
                    joinBtn.disabled = false;
                    joinInput.disabled = false;
                }
            }

            // ============================================================
            // OTAQ ƏMƏLİYYATLARI
            // ============================================================
            function createRoom() {
                console.log('🔥 Otaq yaradılır...');
                const newRoomRef = db.collection('games').doc();
                const roomId = newRoomRef.id;
                currentRoomId = roomId;

                game = new Chess();
                board.position('start');
                myColor = 'white';

                newRoomRef.set({
                    fen: game.fen(),
                    turn: 'w',
                    players: {
                        white: playerId,
                        black: null
                    },
                    lastMoveBy: null,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    console.log('✅ Otaq yaradıldı:', roomId);
                    listenToRoom(roomId);
                    statusEl.textContent = '⏳ Rəqib gözlənilir... (Qara)';
                    updateUI();
                }).catch(err => {
                    showError('Otaq yaradılmadı: ' + err.message);
                });
            }

            function joinRoom(roomId) {
                if (!roomId) return;
                console.log('🔗 Otağa qoşulur:', roomId);
                currentRoomId = roomId;
                game = new Chess();
                board.position('start');
                myColor = null;

                db.collection('games').doc(roomId).get().then((doc) => {
                    if (!doc.exists) {
                        statusEl.textContent = '❌ Otaq tapılmadı';
                        currentRoomId = null;
                        updateUI();
                        return;
                    }
                    listenToRoom(roomId);
                    statusEl.textContent = '⏳ Otağa qoşulur...';
                    updateUI();
                }).catch(err => {
                    showError('Otaq yoxlanılmadı: ' + err.message);
                });
            }

            function leaveRoom() {
                if (currentRoomId) {
                    if (unsubscribe) {
                        unsubscribe();
                        unsubscribe = null;
                    }
                    currentRoomId = null;
                    myColor = null;
                    game = new Chess();
                    board.position('start');
                    statusEl.textContent = '👋 Otaqdan çıxdınız';
                    updateUI();
                }
            }

            // ============================================================
            // EVENT LİSTENERLƏR
            // ============================================================
            createBtn.addEventListener('click', createRoom);
            joinBtn.addEventListener('click', () => {
                const roomId = joinInput.value.trim();
                if (roomId) joinRoom(roomId);
                else alert('Otaq ID daxil edin');
            });
            joinInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') joinBtn.click();
            });
            leaveBtn.addEventListener('click', leaveRoom);

            // İlkin
            updateUI();
            statusEl.textContent = '🟢 Otaq yaradın və ya qoşulun';
            console.log('🎮 Oyunçu ID:', playerId);
            console.log('✅ Oyun hazırdır!');

        } catch (err) {
            showError('Başlanğıc xətası: ' + err.message);
        }
    }

    // ============================================================
    // 3. İŞƏ SAL
    // ============================================================
    // Səhifə tam yükləndikdən sonra başlat
    window.onload = function() {
        initApp().catch(err => {
            showError('Yükləmə xətası: ' + err.message);
        });
    };
</script>
</body>
</html>
