<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Şahmat</title>
    <!-- Chessboard.js (vizuallaşdırma) -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <!-- Chess.js (oyun məntiqi) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/1.0.0-beta.6/chess.min.js"></script>
    <!-- Firebase (Realtime Database) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #1e1e2f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #eee;
            flex-direction: column;
        }
        .container {
            background: #2a2a3c;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 { font-size: 24px; margin-bottom: 10px; color: #f0d9b5; }
        .status { 
            background: #3a3a4e; 
            padding: 8px 16px; 
            border-radius: 30px; 
            font-size: 14px; 
            margin: 10px 0;
            display: inline-block;
        }
        #board {
            width: 100%;
            max-width: 460px;
            margin: 10px auto;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        input, button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            background: #3f3f57;
            color: #fff;
        }
        input {
            flex: 1;
            min-width: 120px;
            background: #1e1e2f;
            border: 1px solid #555;
        }
        button {
            cursor: pointer;
            background: #6c5b7b;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background: #8a7a9a; transform: scale(1.02); }
        button:active { transform: scale(0.98); }
        .btn-primary { background: #4a6fa5; }
        .btn-primary:hover { background: #5f8bc9; }
        .btn-danger { background: #a54a4a; }
        .btn-danger:hover { background: #c95f5f; }
        #roomIdDisplay {
            background: #1e1e2f;
            padding: 6px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 18px;
            letter-spacing: 2px;
            margin: 5px 0;
        }
        .players { font-size: 13px; opacity: 0.8; margin: 5px 0; }
        .footer { margin-top: 15px; font-size: 12px; opacity: 0.5; }
    </style>
</head>
<body>

<div class="container">
    <h1>♟️ Online Şahmat</h1>
    <div class="status" id="status">Hazır deyil</div>
    <div id="board"></div>
    
    <div id="roomInfo">
        <div id="roomIdDisplay">-</div>
        <div class="players" id="playerInfo">Ağ: Gözlənilir | Qara: Gözlənilir</div>
    </div>

    <div class="controls">
        <button class="btn-primary" id="createBtn">✨ Otaq Yarat</button>
        <input type="text" id="joinInput" placeholder="Otaq ID daxil et">
        <button class="btn-primary" id="joinBtn">🔗 Qoşul</button>
        <button class="btn-danger" id="leaveBtn">🚪 Çıx</button>
    </div>
    <div class="footer">Bütün hərəkətlər real-time sinxronlaşır</div>
</div>

<script>
    // ============================================================
    // 1. FIREBASE KONFİQURASİYASI (ÖZ MƏLUMATLARINIZI DAXİL EDİN)
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyB45Kfc8_0DvEUGWlbKIqxYrRmM_HM5ZjE",          // <-- Öz API key-inizi yazın
        authDomain: "kinoflixchess.firebaseapp.com",
        databaseURL: "https://kinoflixchess-default-rtdb.firebaseio.com",
        projectId: "kinoflixchess",
        storageBucket: "kinoflixchess.firebasestorage.app",
        messagingSenderId: "34532322738",
        appId: "1:34532322738:web:07d5f11799c4fdb0e908ab"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ============================================================
    // 2. OYUN VƏZİYYƏTİ
    // ============================================================
    let game = new Chess();                 // Chess.js obyekti
    let board = null;                      // Chessboard.js obyekti
    let currentRoomId = null;             // Hazırki otaq ID-si
    let playerId = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substr(2, 9); // Unikal oyunçu ID
    let myColor = null;                   // 'white' və ya 'black'
    let isGameOver = false;
    let isSyncing = false;                // Firebase-dən gələn yeniləmə zamanı gediş etməmək üçün

    // ============================================================
    // 3. DOM REFERANSLARI
    // ============================================================
    const statusEl = document.getElementById('status');
    const roomIdDisplay = document.getElementById('roomIdDisplay');
    const playerInfoEl = document.getElementById('playerInfo');
    const createBtn = document.getElementById('createBtn');
    const joinBtn = document.getElementById('joinBtn');
    const joinInput = document.getElementById('joinInput');
    const leaveBtn = document.getElementById('leaveBtn');

    // ============================================================
    // 4. BOARDUN QURULMASI
    // ============================================================
    board = Chessboard('board', {
        draggable: true,
        position: 'start',
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: onSnapEnd
    });

    // ============================================================
    // 5. ƏSAS FUNKSİYALAR (Gediş məntiqi)
    // ============================================================
    function onDragStart(source, piece, position, orientation) {
        // Öz növbəmiz deyilsə və ya oyun bitibsə sürüşdürməyə icazə vermə
        if (isGameOver) return false;
        if (myColor === null) return false;
        
        // Fiqurun rəngi ilə oyunçunun rəngi uyğun olmalıdır
        const pieceColor = piece.charAt(0); // 'w' və ya 'b'
        if ((myColor === 'white' && pieceColor !== 'w') || 
            (myColor === 'black' && pieceColor !== 'b')) {
            return false;
        }
        // Firebase-dən gələn yeniləmə zamanı blokla
        if (isSyncing) return false;
        return true;
    }

    function onDrop(source, target) {
        // Gedişi etməyə çalış
        const move = game.move({
            from: source,
            to: target,
            promotion: 'q' // Hər zaman vəzirə çevir (sadəlik üçün)
        });

        if (move === null) return 'snapback'; // Əgər gediş qeyri-mümkündürsə, geri qaytar

        // Gediş uğurludur -> Firebase-ə yaz
        saveGameStateToFirebase();
        updateUI();
    }

    function onSnapEnd() {
        // Sürüşdürmə bitdikdə boardu yenilə
        board.position(game.fen());
    }

    // ============================================================
    // 6. FIREBASE İLƏ SİNXRONİZASİYA
    // ============================================================
    function saveGameStateToFirebase() {
        if (!currentRoomId) return;
        const gameRef = db.ref('games/' + currentRoomId);
        gameRef.update({
            fen: game.fen(),
            turn: game.turn(),
            lastMoveBy: playerId,
            // Oyunçuları da saxla ki, yenidən qoşulanda kim olduğumuzu bilək
            players: {
                white: (myColor === 'white') ? playerId : null,
                black: (myColor === 'black') ? playerId : null
            }
        });
    }

    function listenToRoom(roomId) {
        const gameRef = db.ref('games/' + roomId);
        gameRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                // Otaq silinib və ya mövcud deyil
                statusEl.textContent = '❌ Otaq tapılmadı və ya silindi';
                return;
            }

            isSyncing = true;

            // 1. Oyunçu təyinatı
            const whiteId = data.players?.white || null;
            const blackId = data.players?.black || null;
            
            if (whiteId === playerId) myColor = 'white';
            else if (blackId === playerId) myColor = 'black';
            else {
                // Əgər hələ təyin olunmayıbsa, boş rəngə yaz
                if (whiteId === null) {
                    myColor = 'white';
                    gameRef.child('players/white').set(playerId);
                } else if (blackId === null) {
                    myColor = 'black';
                    gameRef.child('players/black').set(playerId);
                } else {
                    // Hər iki rəng doludur -> tamaşaçı
                    myColor = null;
                    statusEl.textContent = '👀 Oyun tamdır, tamaşa edirsiniz';
                }
            }

            // 2. FEN-i yüklə
            if (data.fen) {
                game.load(data.fen);
                board.position(data.fen);
            }

            // 3. Oyun bitib-bitmədiyini yoxla
            isGameOver = game.game_over();
            if (isGameOver) {
                if (game.in_checkmate()) {
                    statusEl.textContent = '🏆 Şahmat! ' + (game.turn() === 'w' ? 'Qara' : 'Ağ') + ' qazandı!';
                } else if (game.in_draw()) {
                    statusEl.textContent = '🤝 Heç-heçə (pat/ repetition)';
                } else {
                    statusEl.textContent = '⏹️ Oyun bitdi';
                }
            } else {
                const turnText = game.turn() === 'w' ? 'Ağ' : 'Qara';
                statusEl.textContent = `🎯 Növbə: ${turnText}`;
            }

            // 4. İnterfeysi yenilə
            updateUI();
            isSyncing = false;
        });
    }

    // ============================================================
    // 7. İNTERFEYSİ YENİLƏ
    // ============================================================
    function updateUI() {
        if (currentRoomId) {
            roomIdDisplay.textContent = currentRoomId;
        } else {
            roomIdDisplay.textContent = '-';
        }

        const whiteId = null; // Firebasedən gələcək, amma local-də saxlamırıq. 
        // Sadəlik üçün playerInfo-nu firebase listener-i yeniləyəcək.
        // Lakin biz rəngimizi göstərək:
        if (myColor) {
            playerInfoEl.textContent = `Siz: ${myColor === 'white' ? '♔ Ağ' : '♚ Qara'}`;
        } else {
            playerInfoEl.textContent = currentRoomId ? '👤 Tamaşaçı' : 'Otaq seçin';
        }

        // Düymələri aktiv/passiv et
        if (currentRoomId) {
            createBtn.disabled = true;
            joinBtn.disabled = true;
            joinInput.disabled = true;
        } else {
            createBtn.disabled = false;
            joinBtn.disabled = false;
            joinInput.disabled = false;
        }
    }

    // ============================================================
    // 8. OTAQ ƏMƏLİYYATLARI
    // ============================================================
    function createRoom() {
        // Yeni otaq yarat
        const newRoomRef = db.ref('games').push();
        const roomId = newRoomRef.key;
        currentRoomId = roomId;
        
        // Oyunu sıfırla
        game = new Chess();
        board.position('start');
        myColor = 'white'; // Yaradan ağ olur
        
        // Firebase-ə ilkin vəziyyəti yaz
        newRoomRef.set({
            fen: game.fen(),
            turn: 'w',
            players: {
                white: playerId,
                black: null
            },
            lastMoveBy: null
        });

        // Dinləməyə başla
        listenToRoom(roomId);
        statusEl.textContent = '⏳ Rəqib gözlənilir... (Qara)';
        updateUI();
    }

    function joinRoom(roomId) {
        if (!roomId) return;
        currentRoomId = roomId;
        // Oyunu sıfırla
        game = new Chess();
        board.position('start');
        myColor = null; // Listener təyin edəcək
        
        // Dinləməyə başla
        listenToRoom(roomId);
        statusEl.textContent = '⏳ Otağa qoşulur...';
        updateUI();
    }

    function leaveRoom() {
        if (currentRoomId) {
            // Dinləməni dayandır
            const gameRef = db.ref('games/' + currentRoomId);
            gameRef.off();
            
            // Əgər otaqda təkdirsə, otağı sil (isteğe bağlı)
            // gameRef.remove(); // İstəyirsinizsə aktiv edin, amma ehtiyatlı olun.
            
            currentRoomId = null;
            myColor = null;
            game = new Chess();
            board.position('start');
            statusEl.textContent = '👋 Otaqdan çıxdınız';
            updateUI();
        }
    }

    // ============================================================
    // 9. EVENT LİSTENERLƏR
    // ============================================================
    createBtn.addEventListener('click', createRoom);
    joinBtn.addEventListener('click', () => {
        const roomId = joinInput.value.trim();
        if (roomId) joinRoom(roomId);
    });
    joinInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') joinBtn.click();
    });
    leaveBtn.addEventListener('click', leaveRoom);

    // Səhifə açıldıqda ilkin vəziyyət
    updateUI();
    statusEl.textContent = '🟢 Otaq yaradın və ya qoşulun';

    // ============================================================
    // 10. KONSOL KÖMƏKÇİSİ (debug üçün)
    // ============================================================
    console.log('Oyunçu ID:', playerId);
    console.log('Hazırsınız! Otaq yaradın və ya qoşulun.');
</script>
</body>
  </html>
