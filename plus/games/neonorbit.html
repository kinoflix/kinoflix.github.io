function resize(){const r=canvas.getBoundingClientRect(),ow=W,oh=H;W=r.width;H=r.height;dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(player){player.x=clamp(player.x/ow*W,20,W-20);player.y=clamp(player.y/oh*H,100,H-30)}stars=Array.from({length:95},()=>({x:rand(0,W),y:rand(0,H),z:rand(.2,1.3)}))}new ResizeObserver(resize).observe(canvas);
function audio(){try{ac??=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch{}}
function tone(f,d=.08,type='sine',vol=.04){if(!sound||!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(40,f*.45),ac.currentTime+d);g.gain.setValueAtTime(vol,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}
function show(html){$('panel').innerHTML=html;$('overlay').hidden=false;pointer=null;keys={}}
function menu(){show('<div class="eyebrow">Sonsuz kosmos. Tək müdafiəçi.</div><h1>Qaranlığı<br><em>yarıb keç.</em></h1><p>Gəmini idarə et, düşmən dalğalarını dəf et və hər mərhələdə güclən. Orbitin taleyi sənin əlindədir.</p><div class="badges"><span>✦ Gəmi təkmilləşdirmələri</span><span>◈ Böyük rəqiblər</span><span>↗ Sonsuz dalğalar</span></div><button class="primary" id="start">Uçuşa başla →</button><p class="legend">Telefon: barmağınla sürüşdür · Kompüter: WASD / oxlar<br>Atəş avtomatikdir. NOVA yaxın təhlükələri təmizləyir.</p>');$('start').onclick=start}
function start(){audio();score=0;wave=1;kills=0;bullets=[];enemies=[];shots=[];particles=[];drops=[];rings=[];upgrades={fire:0,power:0,speed:0};player={x:W/2,y:H-85,hp:5,max:5,inv:2};novaCD=0;shootClock=0;shake=0;state='play';$('overlay').hidden=true;$('nova').hidden=false;beginWave();hud()}
function beginWave(){spawned=0;spawnClock=1;transition=0;quota=wave%5===0?1:7+wave*2;announce(wave%5===0?'BÖYÜK RƏQİB YAXINLAŞIR':'DALĞA '+String(wave).padStart(2,'0'));hud()}
function announce(t){$('toast').textContent=t;toastTime=2.6}
function hud(){$('score').textContent=String(score).padStart(6,'0');$('wave').textContent=String(wave).padStart(2,'0');$('hp').textContent='●'.repeat(Math.max(0,player?.hp??5))+'○'.repeat(Math.max(0,(player?.max??5)-(player?.hp??5)));$('best').textContent=best}
function burst(x,y,color,n=20){for(let i=0;i<n;i++){let a=rand(0,Math.PI*2),s=rand(35,190);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.25,.8),color})}if(particles.length>500)particles.splice(0,particles.length-500)}
function spawn(){const boss=wave%5===0,type=boss?'boss':Math.random()<.25?'tank':Math.random()<.4?'weaver':'drone',r=boss?Math.min(47,W*.1):type==='tank'?22:15,hp=boss?65+wave*9:type==='tank'?5+Math.floor(wave/3):2+Math.floor(wave/4);enemies.push({x:rand(35,W-35),y:-60,base:rand(40,W-40),r,hp,max:hp,type,t:0,phase:rand(0,6),fire:rand(1,2.5),speed:Math.min(130,45+wave*5)*(type==='tank'?.65:1)});spawned++}
function kill(e){if(e.dead)return;e.dead=true;score+=e.type==='boss'?1500:e.type==='tank'?160:100;kills++;burst(e.x,e.y,e.type==='boss'?'#ff739e':'#80ffdb',e.type==='boss'?65:23);tone(e.type==='boss'?95:180,.18,'triangle',.07);shake=e.type==='boss'?12:3;if(Math.random()<.12||e.type==='boss')drops.push({x:e.x,y:e.y,r:12});hud()}
function damage(){if(player.inv>0||state!=='play')return;player.hp--;player.inv=1.6;shake=12;burst(player.x,player.y,'#ff759f',22);tone(90,.3,'sawtooth',.09);hud();if(player.hp<=0)finish()}
function finish(){state='over';if(score>best){best=score;try{localStorage.setItem('neon-orbit-best',String(best))}catch{}}hud();$('nova').hidden=true;show('<div class="eyebrow">Uçuş tamamlandı</div><h2>Orbit səni yenidən gözləyir.</h2><div class="scoreline"><div><b>'+score+'</b><span>TOPLANAN XAL</span></div><div><b>'+wave+'</b><span>DALĞA</span></div></div><p>'+kills+' düşmən məhv edildi. Rekord: '+best+' xal.</p><button class="primary" id="restart">Yenidən oyna →</button>');$('restart').onclick=start}
function upgrade(){state='upgrade';shots=[];bullets=[];drops=[];$('boss').hidden=true;const choices=[{icon:'ϟ',name:'Sürətli atəş',desc:'Atəş sürəti +18%',apply:()=>upgrades.fire++},{icon:'✦',name:'Güclü mərmi',desc:'Mərmi zərəri +1',apply:()=>upgrades.power++},{icon:'♡',name:'Təmir və zireh',desc:'Maksimum can +1 (ən çox 8), tam təmir',apply:()=>{player.max=Math.min(8,player.max+1);player.hp=player.max}}];show('<div class="eyebrow">Dalğa '+wave+' tamamlandı</div><h2>Növbəti uçuş üçün güclən.</h2><p>Bir təkmilləşdirmə seç. Təsiri oyun boyu qalır.</p><div class="cards">'+choices.map((c,i)=>'<button class="card" data-choice="'+i+'"><span class="icon">'+c.icon+'</span><b>'+c.name+'</b><small>'+c.desc+'</small></button>').join('')+'</div>');document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{choices[+b.dataset.choice].apply();wave++;player.inv=2;state='play';$('overlay').hidden=true;beginWave();tone(600,.15)})}
function pause(){if(state==='play'){state='paused';show('<div class="eyebrow">Uçuş dayandırıldı</div><h2>Bir nəfəs al.</h2><p>Hazır olanda qaldığın yerdən davam et.</p><button id="resume" class="primary">Davam et →</button>');$('resume').onclick=pause}else if(state==='paused'){state='play';$('overlay').hidden=true;audio()}}
function nova(){if(state!=='play'||novaCD>0)return;audio();novaCD=18;shots=[];rings.push({x:player.x,y:player.y,r:0,life:.75});for(const e of enemies){e.hp-=18+upgrades.power*3;if(e.hp<=0)kill(e)}player.inv=Math.max(player.inv,.7);shake=8;tone(130,.45,'triangle',.12);announce('NOVA AKTİVLƏŞDİ')}
$('pause').onclick=pause;$('nova').onclick=nova;$('sound').onclick=()=>{sound=!sound;$('sound').textContent='Səs: '+(sound?'açıq':'bağlı');if(sound)audio()};
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(!e.repeat){if(e.code==='Escape'||e.code==='KeyP')pause();if(e.code==='Space')nova()}});window.addEventListener('keyup',e=>keys[e.code]=false);window.addEventListener('blur',()=>{keys={};if(state==='play')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pause()});
canvas.addEventListener('pointerdown',e=>{if(state!=='play')return;audio();canvas.setPointerCapture(e.pointerId);pointer={id:e.pointerId,x:e.clientX,y:e.clientY}});canvas.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId||state!=='play')return;player.x=clamp(player.x+e.clientX-pointer.x,18,W-18);player.y=clamp(player.y+e.clientY-pointer.y,100,H-25);pointer.x=e.clientX;pointer.y=e.clientY});for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,()=>pointer=null);
function update(dt){clock+=dt;for(const s of stars){s.y+=dt*(state==='play'?30:12)*s.z;if(s.y>H){s.y=0;s.x=rand(0,W)}}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);for(const r of rings){r.r+=dt*950;r.life-=dt}rings=rings.filter(r=>r.life>0);shake=Math.max(0,shake-dt*30);if(state!=='play')return;toastTime-=dt;if(toastTime<=0)$('toast').textContent='';player.inv=Math.max(0,player.inv-dt);novaCD=Math.max(0,novaCD-dt);$('nova').disabled=novaCD>0;$('nova').textContent=novaCD>0?'NOVA · '+Math.ceil(novaCD)+' san':'NOVA · hazır [Space]';let dx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),dy=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0),len=Math.hypot(dx,dy)||1;player.x=clamp(player.x+dx/len*330*dt,18,W-18);player.y=clamp(player.y+dy/len*330*dt,100,H-25);
shootClock-=dt;if(shootClock<=0){shootClock=Math.max(.075,.27/Math.pow(1.18,upgrades.fire));const offsets=wave>=8?[-9,0,9]:wave>=4?[-7,7]:[0];for(const off of offsets)bullets.push({x:player.x+off,y:player.y-18,r:3,damage:1+upgrades.power});tone(740,.045,'sine',.013)}
spawnClock-=dt;if(spawned<quota&&spawnClock<=0){spawn();spawnClock=Math.max(.35,1.1-wave*.04)}
for(const b of bullets)b.y-=600*dt;
for(const e of enemies){if(e.dead)continue;e.t+=dt;if(e.type==='boss'){e.y=Math.min(140,e.y+55*dt);e.x=W/2+Math.sin(e.t*.75)*(W/2-e.r-25)}else{e.y+=e.speed*dt;if(e.type==='weaver')e.x=clamp(e.base+Math.sin(e.t*2.6+e.phase)*65,20,W-20)}e.fire-=dt;if(e.fire<=0&&e.y>20){e.fire=e.type==='boss'?.75:Math.max(.85,2.6-wave*.07);let a=Math.atan2(player.y-e.y,player.x-e.x);for(let i=0;i<(e.type==='boss'?5:1);i++){const angle=a+(e.type==='boss'?(i-2)*.22:0),v=Math.min(245,125+wave*6);shots.push({x:e.x,y:e.y,vx:Math.cos(angle)*v,vy:Math.sin(angle)*v,r:5})}}for(const b of bullets){if(!b.dead&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+b.r){b.dead=true;e.hp-=b.damage;burst(b.x,b.y,'#c5fff1',3);if(e.hp<=0){kill(e);break}}}if(!e.dead&&Math.hypot(player.x-e.x,player.y-e.y)<e.r+11){damage();if(e.type!=='boss')e.dead=true}if(e.y>H+45){e.dead=true;damage()}}

function ship(x,y,r,color,enemy=false,boss=false){ctx.save();ctx.translate(x,y);if(enemy)ctx.rotate(Math.PI);ctx.shadowColor=color;ctx.shadowBlur=16;ctx.strokeStyle=color;ctx.fillStyle=enemy?'#321c39':'#133b43';ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(0,-r*1.25);ctx.lineTo(r,r);ctx.lineTo(r*.25,r*.62);ctx.lineTo(0,r*.9);ctx.lineTo(-r*.25,r*.62);ctx.lineTo(-r,r);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,-r*.6);ctx.lineTo(r*.22,r*.3);ctx.lineTo(-r*.22,r*.3);ctx.fill();if(!enemy){ctx.fillStyle='#80ffdb';ctx.beginPath();ctx.moveTo(-4,r*.85);ctx.lineTo(0,r+rand(8,21));ctx.lineTo(4,r*.85);ctx.fill()}if(boss){ctx.strokeRect(-r*1.2,-r*.2,r*.45,r);ctx.strokeRect(r*.75,-r*.2,r*.45,r)}ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);const g=ctx.createRadialGradient(W*.5,H*.3,0,W*.5,H*.3,Math.max(W,H)*.7);g.addColorStop(0,'#17233b');g.addColorStop(.55,'#0d152b');g.addColorStop(1,'#070c1b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#627c9b0c';ctx.lineWidth=1;for(let x=0;x<W;x+=65){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=(clock*12)%65;y<H;y+=65){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(const s of stars){ctx.globalAlpha=s.z*.6;ctx.fillStyle='#c0d9ff';ctx.fillRect(s.x,s.y,s.z,s.z*2)}ctx.globalAlpha=1;ctx.save();if(shake)ctx.translate(rand(-shake,shake),rand(-shake,shake));if(state==='menu'){ctx.strokeStyle='#80ffdb12';for(let i=1;i<=3;i++){ctx.beginPath();ctx.arc(W/2,H/2,80+i*65,0,Math.PI*2);ctx.stroke()}ship(W/2,H*.82,22,'#80ffdb')}
ctx.shadowBlur=12;ctx.shadowColor='#80ffdb';ctx.fillStyle='#a5ffe8';for(const b of bullets)ctx.fillRect(b.x-2,b.y-8,4,15);ctx.shadowBlur=0;for(const e of enemies){const color=e.type==='boss'?'#ff719f':e.type==='tank'?'#ffc780':'#b394ff';ship(e.x,e.y,e.r,color,true,e.type==='boss');if(e.hp<e.max&&e.type!=='boss'){ctx.fillStyle='#ffffff25';ctx.fillRect(e.x-16,e.y-e.r-12,32,3);ctx.fillStyle=color;ctx.fillRect(e.x-16,e.y-e.r-12,32*e.hp/e.max,3)}}ctx.fillStyle='#ff8caf';ctx.shadowColor='#ff719f';ctx.shadowBlur=12;for(const s of shots){ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0;for(const d of drops){ctx.save();ctx.translate(d.x,d.y);ctx.rotate(clock);ctx.strokeStyle='#80ffdb';ctx.strokeRect(-10,-10,20,20);ctx.restore();ctx.fillStyle='#80ffdb';ctx.fillRect(d.x-5,d.y-1,10,2);ctx.fillRect(d.x-1,d.y-5,2,10)}if(player&&state!=='over'){if(player.inv>0){ctx.strokeStyle='#80ffdb77';ctx.beginPath();ctx.arc(player.x,player.y,27,0,Math.PI*2);ctx.stroke()}ctx.globalAlpha=player.inv>0?.55+Math.sin(clock*24)*.25:1;ship(player.x,player.y,16,'#80ffdb');ctx.globalAlpha=1}for(const p of particles){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3)}for(const r of rings){ctx.globalAlpha=r.life;ctx.strokeStyle='#80ffdb';ctx.lineWidth=5;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke()}ctx.globalAlpha=1;ctx.restore()}
function frame(t){const dt=Math.min((t-last)/1000,.034);last=t;update(dt);draw();requestAnimationFrame(frame)}resize();menu();requestAnimationFrame(frame);
</script></body></html>
